name: CI Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build NeoForge with Gradle
        run: ./gradlew :neoforge:build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quackedmod-jar
          # Upload only the main jar (exclude dev/sources/shadow)
          path: |
            neoforge/build/libs/*.jar
            !neoforge/build/libs/*-dev.jar
            !neoforge/build/libs/*-shadow.jar
            !neoforge/build/libs/*-sources.jar
          retention-days: 7

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # fetch-depth: 0 pulls full history + all tags so we can diff against the previous tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Guard: the tag must match mod_version, or the released jars would report the
      # wrong version to the loader / update-checker. Fail fast instead of shipping drift.
      - name: Verify tag matches mod_version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PROP="$(grep -E '^mod_version' gradle.properties | sed -E 's/.*=[[:space:]]*//')"
          if [ "$TAG" != "$PROP" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (=$TAG) does not match gradle.properties mod_version ($PROP). Bump gradle.properties and re-tag."
            exit 1
          fi

      - name: Build both jars
        run: ./gradlew :fabric:build :neoforge:build

      # Copy the exact main jars by version so sources/dev jars are never picked up.
      - name: Collect release jars
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release-jars
          cp "fabric/build/libs/quack-fabric-${VERSION}.jar" release-jars/
          cp "neoforge/build/libs/quack-neoforge-${VERSION}.jar" release-jars/

      # Build the release body from every commit since the previous tag.
      # GitHub's built-in generate_release_notes is PR-based and produces an empty
      # list for our tagging flow (tags cut from direct commits, no PRs in range),
      # so we assemble the changelog from the git log instead.
      - name: Build changelog
        run: |
          TAG="$GITHUB_REF_NAME"
          # Nearest tag reachable from this tag's parent; empty on the very first release.
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          {
            echo "## What's Changed"
            echo
            if [ -n "$PREV" ]; then
              git log --no-merges --pretty=format:'- %s (%h)' "${PREV}..${TAG}"
              echo
              echo
              echo "**Full Changelog**: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            else
              git log --no-merges --pretty=format:'- %s (%h)' "${TAG}"
            fi
          } > release-notes.md
          echo "----- generated release notes -----"
          cat release-notes.md

      - name: Create release and attach jars
        uses: softprops/action-gh-release@v2
        with:
          files: release-jars/*.jar
          fail_on_unmatched_files: true
          body_path: release-notes.md
