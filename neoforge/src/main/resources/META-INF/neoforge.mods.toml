modLoader = "javafml"
loaderVersion = "[9,)"
#issueTrackerURL = "https://github.com/rvhoyos/QuackMod/issues"
license = "All Rights Reserved"

[[mods]]
modId = "quack"
version = "${version}"
displayName = "QuackedDucks"
authors = "rvhoyos"
description = '''
New duck entity with custom items such as meat, cooked meat, foie gras with buffs and custom Duck AI behavior on land, water, and air with flocking and migration
'''
iconFile = "icon.png"


[[dependencies.quack]]
modId = "neoforge"
type = "required"
versionRange = "[26.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.quack]]
modId = "minecraft"
type = "required"
versionRange = "[26.1,)"
ordering = "NONE"
side = "BOTH"

# GeckoLib is `implementation`, not `include`, in neoforge/build.gradle, so it is not
# bundled into the jar. Without this entry a user missing it gets a ClassNotFoundException
# instead of NeoForge's missing-dependency screen.
# side = BOTH: DuckEntity implements GeoEntity in common code, so the server needs it too.
[[dependencies.quack]]
modId = "geckolib"
type = "required"
versionRange = "[5.5.3,6)"
ordering = "NONE"
side = "BOTH"

[[mixins]]
config = "quack.mixins.json"
