// NeoForge module
plugins {
    id 'net.neoforged.moddev' version '2.0.148'
}

neoForge {
    version = rootProject.neoforge_version

    runs {
        client {
            client()
            programArguments.addAll '--username', 'Dev'
        }
        // Second dev client for multiplayer testing. The server rejects two logins
        // with the same username, so this one is Dev2 with its own run dir.
        client2 {
            client()
            gameDirectory = project.file('runs/client2')
            programArguments.addAll '--username', 'Dev2'
            // Two clients on one machine race to extract LWJGL natives into the same
            // shared temp dir; give this one its own.
            systemProperty 'org.lwjgl.system.SharedLibraryExtractDirectory', 'lwjgl-client2'
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        quack {
            sourceSet project.sourceSets.main
        }
    }
}

dependencies {
    // Common module
    compileOnly project(':common')

    // GeckoLib NeoForge
    implementation "com.geckolib:geckolib-neoforge-${rootProject.minecraft_version}:${rootProject.geckolib_version}"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }
}
